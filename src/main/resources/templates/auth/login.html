<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/board">게시판 서비스</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/board">게시글</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="/login" class="btn btn-outline-primary me-2">로그인</a>
                    <a href="/signup" class="btn btn-primary">회원가입</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 80px; min-height: 80vh;">
        <div class="row justify-content-center align-items-center" style="height: 70vh;">
            <div class="col-md-4">
                <div class="card p-4">
                    <h3 class="text-center mb-4 fw-bold">로그인</h3>
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                    <form action="/login" method="post">
                        <div class="mb-3">
                            <label for="id" class="form-label">사용자 ID (숫자)</label>
                            <input type="number" class="form-control" id="id" name="id" required placeholder="숫자 ID를 입력하세요">
                        </div>
                        <div class="mb-3">
                            <label for="pw" class="form-label">비밀번호</label>
                            <input type="password" class="form-control" id="pw" name="pw" required placeholder="비밀번호를 입력하세요">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary py-2">로그인</button>
                        </div>
                    </form>
                    <div class="mt-3 text-center">
                        <small class="text-muted">계정이 없으신가요? <a href="/signup">회원가입</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 mt-5 bg-white border-top">
        <div class="container text-center text-muted">
            &copy; 2025 게시판 서비스. All rights reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
