<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/board">게시판 서비스</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/board">게시글</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <span class="navbar-text me-3">환영합니다!</span>
                    <a href="/logout" class="btn btn-outline-secondary">로그아웃</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 80px; min-height: 80vh;">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="mb-4">
                    <a href="/board" class="text-decoration-none text-muted">&larr; 목록으로</a>
                </div>
                
                <div class="card p-4">
                    <h2 class="fw-bold mb-4">새 게시글 작성</h2>
                    
                    <form action="/board/write" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">제목</label>
                            <input type="text" class="form-control form-control-lg" id="title" name="title" required placeholder="게시글 제목을 입력하세요">
                        </div>
                        
                        <div class="mb-4">
                            <label for="content" class="form-label fw-bold">내용</label>
                            <textarea class="form-control" id="content" name="content" rows="10" required placeholder="내용을 입력하세요..."></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2">
                            <a href="/board" class="btn btn-light border">취소</a>
                            <button type="submit" class="btn btn-primary px-4">게시하기</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 mt-5 bg-white border-top">
        <div class="container text-center text-muted">
            &copy; 2025 게시판 서비스. All rights reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
