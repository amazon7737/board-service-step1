<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title}">게시글 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/board">게시판 서비스</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/board">게시글</a>
                    </li>
                </ul>
                <div class="d-flex" th:if="${!isLoggedIn}">
                    <a href="/login" class="btn btn-outline-primary me-2">로그인</a>
                    <a href="/signup" class="btn btn-primary">회원가입</a>
                </div>
                <div class="d-flex" th:if="${isLoggedIn}">
                    <span class="navbar-text me-3">환영합니다!</span>
                    <a href="/logout" class="btn btn-outline-secondary">로그아웃</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 80px; min-height: 80vh;">
        <div class="mb-4">
            <a href="/board" class="text-decoration-none text-muted">&larr; 목록으로</a>
        </div>
        
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="fw-bold mb-0" th:text="${post.title}">Post Title</h1>
                <div class="text-muted text-end">
                    <div th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</div>
                    <small th:text="'작성자: ' + ${post.userId}">작성자</small>
                </div>
            </div>
            
            <hr class="my-4">
            
            <div class="content py-3" style="min-height: 200px; white-space: pre-wrap;" th:text="${post.content}">
                게시글 내용이 여기에 표시됩니다...
            </div>
            
            <div class="mt-5 pt-3 border-top">
                <h5 class="fw-bold mb-4">댓글 <span class="badge bg-secondary" th:text="${#lists.size(comments)}">0</span></h5>
                
                <!-- 댓글 작성 폼 (로그인 사용자만) -->
                <div th:if="${isLoggedIn}" class="mb-4">
                    <form th:action="@{/board/{id}/comments(id=${post.id})}" method="post">
                        <div class="mb-2">
                            <textarea class="form-control" name="content" rows="3" required placeholder="댓글을 입력하세요..."></textarea>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary btn-sm">댓글 작성</button>
                        </div>
                    </form>
                </div>
                
                <div th:if="${!isLoggedIn}" class="alert alert-info">
                    댓글을 작성하려면 <a href="/login">로그인</a>이 필요합니다.
                </div>
                
                <!-- 댓글 목록 -->
                <div th:if="${#lists.isEmpty(comments)}" class="text-muted text-center py-4">
                    아직 댓글이 없습니다. 첫 댓글을 작성해보세요!
                </div>
                
                <div th:each="comment : ${comments}" class="mb-3">
                    <!-- 일반 댓글 (parentId가 null인 경우) -->
                    <div th:if="${comment.parentId == null}" class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <strong class="text-primary" th:text="'사용자 ' + ${comment.userId}">사용자</strong>
                                    <small class="text-muted ms-2" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</small>
                                </div>
                                <div th:if="${isLoggedIn and currentUserId == comment.userId}">
                                    <form th:action="@{/board/comments/{id}/delete(id=${comment.id})}" method="post" style="display: inline;">
                                        <input type="hidden" name="postId" th:value="${post.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
                                    </form>
                                </div>
                            </div>
                            <p class="mb-2" th:text="${comment.content}">댓글 내용</p>
                            
                            <!-- 대댓글 작성 버튼 -->
                            <button th:if="${isLoggedIn}" 
                                    class="btn btn-sm btn-link text-decoration-none p-0" 
                                    type="button" 
                                    th:attr="data-bs-toggle='collapse', data-bs-target='#reply-form-' + ${comment.id}">
                                답글 작성
                            </button>
                            
                            <!-- 대댓글 작성 폼 -->
                            <div th:if="${isLoggedIn}" class="collapse mt-3" th:id="'reply-form-' + ${comment.id}">
                                <form th:action="@{/board/{id}/comments(id=${post.id})}" method="post">
                                    <input type="hidden" name="parentId" th:value="${comment.id}">
                                    <div class="mb-2">
                                        <textarea class="form-control form-control-sm" name="content" rows="2" required placeholder="답글을 입력하세요..."></textarea>
                                    </div>
                                    <div class="text-end">
                                        <button type="submit" class="btn btn-primary btn-sm">답글 작성</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 대댓글 (parentId가 있는 경우) -->
                    <div th:if="${comment.parentId != null}" class="card ms-5 mt-2 bg-light">
                        <div class="card-body py-2">
                            <div class="d-flex justify-content-between align-items-start mb-1">
                                <div>
                                    <strong class="text-secondary" th:text="'사용자 ' + ${comment.userId}">사용자</strong>
                                    <small class="text-muted ms-2" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</small>
                                </div>
                                <div th:if="${isLoggedIn and currentUserId == comment.userId}">
                                    <form th:action="@{/board/comments/{id}/delete(id=${comment.id})}" method="post" style="display: inline;">
                                        <input type="hidden" name="postId" th:value="${post.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger btn-sm" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
                                    </form>
                                </div>
                            </div>
                            <p class="mb-0 small" th:text="${comment.content}">대댓글 내용</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 mt-5 bg-white border-top">
        <div class="container text-center text-muted">
            &copy; 2025 게시판 서비스. All rights reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
