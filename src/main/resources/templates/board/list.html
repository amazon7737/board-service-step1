<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 목록</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 구글 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 커스텀 CSS -->
    <link href="/css/index.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/board">게시판 서비스</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/board">게시글</a>
                    </li>
                </ul>
                <div class="d-flex" th:if="${!isLoggedIn}">
                    <a href="/login" class="btn btn-outline-primary me-2">로그인</a>
                    <a href="/signup" class="btn btn-primary">회원가입</a>
                </div>
                <div class="d-flex" th:if="${isLoggedIn}">
                    <span class="navbar-text me-3">환영합니다!</span>
                    <a href="/logout" class="btn btn-outline-secondary">로그아웃</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 80px; min-height: 80vh;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">최신 게시글</h2>
            <a th:if="${isLoggedIn}" href="/board/write" class="btn btn-primary">
                + 새 글쓰기
            </a>
        </div>

        <div class="row">
            <div class="col-12" th:if="${#lists.isEmpty(posts)}">
                <div class="text-center py-5 text-muted">
                    <p>아직 게시글이 없습니다.</p>
                </div>
            </div>
            
            <div class="col-12 mb-3" th:each="post : ${posts}">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title fw-bold mb-0">
                                <a th:href="@{/board/{id}(id=${post.id})}" class="text-decoration-none text-dark stretched-link" th:text="${post.title}">Post Title</a>
                            </h5>
                            <span class="badge bg-light text-dark border" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                        </div>
                        <p class="card-text text-muted text-truncate" style="max-width: 100%;" th:text="${post.content}">내용 미리보기...</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <small class="text-muted" th:text="'작성자: ' + ${post.userId}">작성자</small>
                            <small class="text-primary fw-medium">더보기 &rarr;</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 mt-5 bg-white border-top">
        <div class="container text-center text-muted">
            &copy; 2025 게시판 서비스. All rights reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
