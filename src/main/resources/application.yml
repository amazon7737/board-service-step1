spring:
  datasource:
    url: jdbc:mysql://localhost:3306/board-1
      ?useSSL=false
      &serverTimezone=Asia/Seoul
      &characterEncoding=UTF-8
      &rewriteBatchedStatements=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never
#      mode: always
      encoding: UTF-8
      continue-on-error: false

  jdbc:
    template:
      fetch-size: 100
      max-rows: 1000

    datasource:
      hikari:
        pool-name: BoardHikariPool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        auto-commit: false

logging:
  level:
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    com.zaxxer.hikari: INFO
server:
  port: 8081
  servlet:
    session:
      timeout: 30m # ???? 30?